name: Daily Dev Log
on:
  schedule:
    - cron: "0 16 * * *"         # 每天 UTC 16:00 = 北京时间 0 点, 生成昨天(完整一天)的日志
  workflow_dispatch:             # 可手动触发
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'          # 缓存 PyPI 依赖, 避免每次重新下载
      - name: 安装中文字体
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-wqy-microhei
      - name: 安装依赖(词云+中文分词)
        run: pip install -r requirements.txt   # wordcloud(含 matplotlib) + jieba
      - name: 生成每日开发日志(AI总结+词云+时间饼图+存档)
        run: python .github/scripts/gen_log.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}          # 用PAT搜索用户所有仓库提交
          DEEPSEEK_TOKEN: ${{ secrets.DEEPSEEK_TOKEN }}
          FONT_PATH: /usr/share/fonts/truetype/wqy/wqy-microhei.ttc
      - name: 提交日志
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 每日开发日志 [skip ci]"
          file_pattern: README.md logs/* wordcloud.png pie.svg
