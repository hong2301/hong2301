name: Daily Dev Log
on:
  schedule:
    - cron: "50 15 * * *"        # 每天 UTC 15:50 = 北京时间 23:50 生成当日日志
  workflow_dispatch:             # 可手动触发
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖(词云+中文分词)与中文字体
        run: |
          pip install wordcloud jieba
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-microhei
      - name: 生成每日开发日志(AI总结+词云+时间饼图+存档)
        run: python .github/scripts/gen_log.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_TOKEN: ${{ secrets.DEEPSEEK_TOKEN }}
          FONT_PATH: /usr/share/fonts/truetype/wqy/wqy-microhei.ttc
      - name: 提交日志
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 每日开发日志 [skip ci]"
          file_pattern: README.md logs/* wordcloud.png pie.svg
